# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

display_name: Jinja Partials
parser: google
dynamic: true

# Subpath hosting: drives Quarto's base path so CSS/JS/nav resolve. Keep trailing slash.
site_url: "https://mkennedy.codes/docs/jinja-partials/"

# Sitemap/robots/canonical/og:url use a SEPARATE base URL that Great Docs auto-detects
# from the GitHub repo (-> owner.github.io/repo) and does NOT fall back to site_url.
# Set it explicitly or the sitemap points at the wrong domain.
seo:
  canonical:
    base_url: "https://mkennedy.codes/docs/jinja-partials/"

repo: https://github.com/mikeckennedy/jinja_partials
github_style: widget
source:
  enabled: true
  branch: main
  placement: usage
pypi: true

# Great Docs defaults mcp.enabled to true, rendering an empty "MCP" tab even with
# no MCP server. This project does not ship one.
mcp:
  enabled: false

# Umami analytics — merged into Quarto's format.html.include-in-header, so it lands in
# the <head> of every generated page.
include_in_header:
  - text: |
      <script async src="https://uma.mkennedy.codes/script.js" data-website-id="fc9b6770-3b44-4073-944e-4a4f0e79f66a"></script>

# Great Docs demotes README headings ('#' -> '##') when generating index.qmd but
# also corrupts '#' comment lines inside fenced code blocks. This hook repairs them.
pre_render:
  - scripts/fix_readme_code_comments.py

skill:
  # Hand-written prose injected into the generated skill body — wiring, explicit
  # data flow, layout conventions, and the async rendering model — things the API
  # signatures can't convey. Adapted from the jinja-partials_reference.md agent guide.
  extra_body: skill_extra_body.md
  gotchas:
    - "register_starlette_extensions takes templates FIRST with app as an optional keyword — the argument order differs from register_fastapi_extensions(app, templates)."
    - "register_environment defaults markup=False while every other registration path uses markup=True; with autoescaping on, forgetting markup=True makes partials show up as escaped HTML text."
    - "PartialsJinjaExtension on a Flask app renders partials through the Jinja environment, not flask.render_template — context processors, g, and request are unavailable inside partials; use register_extensions(app) if you need them."
    - "render_partial with no renderer falls back to flask.render_template and raises PartialsException('No renderer specified') when Flask is not installed — pass a renderer or use generate_render_partial outside Flask."
    - "Calling register_fastapi_extensions or register_starlette_extensions twice on the same app double-wraps the lifespan (no idempotency guard) — register exactly once at startup."
    - "On an enable_async=True FastAPI/Starlette environment, render pages with await template.render_async(...) + HTMLResponse; templates.TemplateResponse(...) calls asyncio.run() inside the running event loop and crashes."
  best_practices:
    - "Register once at app startup, before the app starts serving, so the partial-rendering executor is tied to the app's lifecycle."
    - "Pass app= to register_starlette_extensions when you have one — it upgrades from the shared module-level executor to a lifespan-managed one."
    - "Keep partials in templates/shared/partials/ and pass model data explicitly as keyword arguments; partials do not inherit the caller's context."
    - "Install as `pip install jinja-partials` (hyphen) but import as `jinja_partials` (underscore)."
  decision_table:
    - need: "Flask app"
      use: "jinja_partials.register_extensions(app)"
    - need: "Quart app"
      use: "jinja_partials.register_quart_extensions(app)"
    - need: "FastAPI app"
      use: "jinja_partials.register_fastapi_extensions(app, templates)"
    - need: "Starlette app"
      use: "jinja_partials.register_starlette_extensions(templates, app=app)"
    - need: "Plain Jinja2 environment or unsupported framework"
      use: "jinja_partials.register_environment(env, markup=True)"
    - need: "Declarative environment configuration"
      use: "Environment(extensions=['jinja_partials.PartialsJinjaExtension'])"
    - need: "Custom render pipeline"
      use: "generate_render_partial(renderer) installed as a Jinja global"

authors:
  - name: Michael Kennedy
    role: Author
    email: michael@talkpython.fm
    github: mikeckennedy
    homepage: https://mkennedy.codes

reference:
  title: "API Reference"
  desc: "Public API for jinja_partials: framework registration, partial rendering, and the Jinja2 extension."
  sections:
    - title: Framework registration
      desc: Register render_partial with your web framework once at app startup.
      contents:
        - register_extensions
        - register_fastapi_extensions
        - register_starlette_extensions
        - register_quart_extensions
        - register_environment

    - title: Rendering
      desc: Render partial templates directly or build framework-specific renderers.
      contents:
        - render_partial
        - generate_render_partial

    - title: Jinja2 extension
      desc: Declarative registration via the Jinja2 extension mechanism.
      contents:
        - PartialsJinjaExtension

    - title: Exceptions
      desc: Errors raised by jinja_partials.
      contents:
        - PartialsException

jupyter: python3
